name: CI

# ビルド・テスト・静的解析・脆弱性チェックを PR と main への push で回す。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # cgo(CoreGraphics / AppKit 等)を使うため macOS ランナーで動かす。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # go.mod の go ディレクティブ(1.26.4 以上)に追随させる。
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build -ldflags=-extldflags=-Wl,-no_warn_duplicate_libraries ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  server:
    # 中継サーバ(Cloudflare Workers)のテストと型チェック。cgo 不要なので ubuntu で速く回す。
    # ここで回さないと server/ の変更(と Renovate の npm 依存 automerge)が
    # リリース(タグ push)まで無検証になる。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        # vitest は型エラーを検出しないので tsc を別に回す
        run: npm run typecheck

      - name: Test
        run: npm test

  govulncheck:
    # 依存(標準ライブラリ含む)の既知脆弱性を継続的にチェックする。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run govulncheck
        # @latest だと再現性がないためバージョンを固定する(上げるときはここを更新)。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          "$(go env GOPATH)/bin/govulncheck" ./...
